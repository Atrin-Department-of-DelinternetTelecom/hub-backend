              type: "array"
              items:
                type: object
                properties:
                  name:
                    type: string
            meta:
              type: "object"
              properties:
                code:
                  type: "number"
                status:
                  type: "string"
                  minLength: 1
              required:
                - "code"
                - "status"
      "401":
        description: "Unauthorized"
        schema:
          $ref: "#/definitions/Response_401"
      "403":
        description: "Forbidden"
