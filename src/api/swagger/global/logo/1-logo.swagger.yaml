      - "logo"
    summary: "upload logo"
    description: "upload logo"
    operationId: "uploadLogo"
    security:
      - Bearer: []
    parameters: 
      - in: formData
        type: file
        name: image
        description: logo image
      - in: formData
        type: boolean
        name: isIcon
        description: logo image    
    responses:
      "200":
        description: "OK"
        schema:
          type: "object"
