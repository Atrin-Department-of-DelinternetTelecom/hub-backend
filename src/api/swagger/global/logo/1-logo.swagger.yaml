/logo:
  get:
    tags:
      - "logo"
    summary: "get logo image"
    description: "download logo"
    operationId: "downloadLogo"
    parameters: 
      - in: query
        type: boolean
        name: isIcon
        description: logo or icon    
    responses:
      "200":
        description: "OK"
      "401":
        description: "Unauthorized"
