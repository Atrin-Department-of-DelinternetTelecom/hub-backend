  post:
    tags:
      - 'user'
    summary: 'create new user'
    security:
      - Bearer: []
    produces:
      - 'application/json'
    description: 'add a user to system'
    operationId: 'postUsers'
    parameters:
      - in: 'body'
        name: 'body'
        description: 'we can update every field of user'
        required: true
        schema:
          type: 'object'
          required:
            - 'username'
            - 'first_name'
            - 'last_name'
            - 'email'
          properties:
            username:
              type: 'string'
              example: 'akbzh'
              minLength: 4
            first_name:
              type: 'string'
              example: 'ali'
              minLength: 2
            last_name:
              type: 'string'
              example: 'akbzh'
              minLength: 2
            password:
              type: 'string'
              example: 'a password'
            enable:
              type: 'boolean'
              example: true
            email:
              type: 'string'
              example: 'aliakbzh@email.com'
              format: email
            role_id:
              type: 'number'
              example: 12
            collaborator_id:
              type: 'number'
              example: 2
            avatar:
              type: 'string'
              example: 'file.png'
            dni:
              type: 'string'
              example: 'a dni'
            language:
              type: 'string'
              enum:
                - en
                - es
                - ca
              example: 'en'
            # calendar setting
            color:
              type: 'string'
              example: '#ffffff'
            pinned:
              type: 'boolean'
              example: false
            selected_by_default:
              type: 'boolean'
              example: false
            user_type:
              type: 'string'
              enum:
                - client
                - employee
                - service

          description: 'we can update fields of user'
          x-examples:
            example-1:
              name: 'mamad'
    responses:
      '201':
        description: 'Created'
        schema:
          type: 'object'
          required:
            - 'data'
            - 'meta'
          properties:
            data:
              $ref: '#/definitions/User'
            meta:
              type: 'object'
              properties:
                code:
                  type: 'number'
                status:
                  type: 'string'
                  minLength: 1
              required:
                - 'code'
                - 'status'
          description: ''
          x-examples:
            example-1:
              data:
                created_at: '2021-04-27T17:13:47.000000Z'
                id: 1
                name: 'management'
                updated_at: '2021-04-27T17:13:47.000000Z'
              meta:
                code: 200
                status: 'success'
      '401':
        description: 'Unauthorized'
        schema:
          $ref: '#/definitions/Response_401'
      '403':
        description: 'Forbidden'
        schema:
          $ref: '#/definitions/Response_403'
      '500':
        description: 'InternalServerError'
        schema:
          $ref: '#/definitions/Response_500'
    x-swagger-router-controller: 'User'
