/bulks/{id}:
  patch:
    tags:
      - "action"
    summary: ""
    description: "change bulk status to 'stopped', 'paused' or 'running'"
    operationId: "changeBulkStatus"
    security:
      - Bearer: []
    parameters:
      - name: "id"
        in: "path"
        description: "bulk id"
        required: true
        type: "string"
      - in: body
        name: body
        schema:
          type: object      
          required:
            - status
          properties: 
            status:
              type: string
              enum: [ "stopped", "paused", "running" ]
  
    responses:
      "200":
        description: "OK"
        schema:
          type: "object"
          properties:
            data:
              $ref: "#/definitions/ChangeFeeBulk"
          description: ""
      "401":
        description: "Unauthorized"
        schema:
          $ref: "#/definitions/Response_401"
      "403":
        description: "Forbidden"
        schema:
          $ref: "#/definitions/Response_403"
      "500":
        description: "InternalServerError"
        schema:
          $ref: "#/definitions/Response_500"
    x-swagger-router-controller: "Action"
