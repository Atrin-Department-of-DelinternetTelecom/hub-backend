/backups/{id}/secure-download-url:
  get:
    tags:
      - "backup"
    operationId: "getSecureDownloadLink"
    security:
      - Bearer: []
    produces:
      - "application/json"
    parameters:
      - name: id
        in: "path"
        description: "The ID of the backup"
        required: true
        type: "string"
        minLength: 1
    responses:
      "200":
        description: "OK"
        schema:
          type: "object"
          required:
            - "data"
            - "meta"
          properties:
            meta:
              type: "object"
              properties:
                code:
                  type: "number"
                status:
                  type: "string"
                  minLength: 1
              required:
                - "code"
                - "status"
          description: ""
      "401":
        description: "Unauthorized"
        schema:
          $ref: "#/definitions/Response_401"
      "403":
        description: "Forbidden"
        schema:
          $ref: "#/definitions/Response_403"
      "500":
        description: "InternalServerError"
        schema:
          $ref: "#/definitions/Response_500"
    x-swagger-router-controller: "Backup"
