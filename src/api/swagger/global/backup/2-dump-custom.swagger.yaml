/backups/trigger-custom-dump:
  post:
    tags:
      - "backup"
    operationId: "triggerCustomDump"
    security:
      - Bearer: []
    produces:
      - "application/json"
    parameters:
      - in: "body"
        name: "body"
        required: true
        schema:
          type: "object"
          properties:
            database:
              type: "string"
              minLength: 1
            tables:
              type: "array"
              items:
                type: "string"
                minLength: 1
    responses:
      "200":
        description: "OK"
        schema:
          type: "object"
          required:
            - "data"
            - "meta"
          properties:
            meta:
              type: "object"
              properties:
                code:
                  type: "number"
                status:
                  type: "string"
                  minLength: 1
              required:
                - "code"
                - "status"
          description: ""
      "401":
        description: "Unauthorized"
        schema:
          $ref: "#/definitions/Response_401"
      "403":
        description: "Forbidden"
        schema:
          $ref: "#/definitions/Response_403"
      "500":
        description: "InternalServerError"
        schema:
          $ref: "#/definitions/Response_500"
    x-swagger-router-controller: "Backup"
