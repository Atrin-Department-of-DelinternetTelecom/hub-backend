definitions:
  Action:
    type: "object"
    required:
      - "id"
      - "name"
      - "acl_menu_id"
      - "api_method"
      - "api_path"
      - "creator_id"
      - "created_at"
      - "updated_at"
      - "deleted_at"
    properties:
      id:
        type: "number"
        example: 12
      name:
        type: "string"
        example: "payroll"
      acl_menu_id:
        type: "number"
        example: 23
      api_method:
        type: "string"
        example: "POST"
      api_path:
        type: "string"
        example: "/api/vacations/:id"
      creator_id:
        type: "number"
        example: 12
      updated_at:
        type: "string"
        example: "2021-04-29 01:47:27.0"
        minLength: 1  
      created_at:
        type: "string"
        example: "2021-04-29 01:47:27.0"
        minLength: 1
      deleted_at:
        type: "string"
        example: "2021-04-29 01:47:27.0"
        minLength: 1
    description: ""
    title: "action"