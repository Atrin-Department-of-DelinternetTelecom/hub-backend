definitions:
  MailSender:
    type: object
    properties:
      id: 
        type: integer
        format: int32
        example: 12
      uid: 
        type: integer
        format: int32
        example: 12
      alias: 
        type: string
        example: 'ali@delinternet.com'
      mail: 
        type: string
        example: 'mail'
      host: 
        type: string
        example: 'host'
      port: 
        type: integer
        format: int32
        example: 34
      userName: 
        type: string
        example: 'ali'
      password: 
        type: string
        example: '1234567'
      ssl: 
        type: boolean
        example: false
      imapHost: 
        type: string
        example: 'imap host'
      sentFolder: 
        type: string
        example: '12'
      netErrors: 
        type: string
        example: 'this is net error'
      currentFolders: 
        type: string
        example: 'this is current folder'
      forceUnseen: 
        type: boolean
        example: false
      asDefault: 
        type: boolean
        example: false
      status:
        type: number
        example: 0
    description: ''
    title: 'mail-sender'