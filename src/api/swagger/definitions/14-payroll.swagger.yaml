definitions:
  Payroll:
    type: "object"
    required:
      - "creator_id"
      - "employee_id"
      - "id"
      - "salary"
      - "status"
    properties:
      company_signature_date:
        type: "string"
        format: "date-time"
      created_at:
        type: "string"
        format: "date-time"
      creator_id:
        type: "number"
        example: 12
      deleted_at:
        type: "string"
        format: "date-time"
      details:
        type: "string"
        example: "some details is here"
        minLength: 1
      employee_id:
        type: "number"
        example: 12
      employee_signature_date:
        type: "string"
        format: "date-time"
      id:
        type: "number"
        example: 2
      salary:
        type: "number"
        format: "double"
        example: 3
        minimum: 0
      status:
        type: "string"
        example: "pending"
        minLength: 1
        enum:
          - "pending"
          - "readyToPay"
          - "paid"
          - "cancel"
      updated_at:
        type: "string"
        format: "date-time"
    description: ""
    title: "Payroll"
    x-examples:
      example-1:
        company_signature_date: "2021-04-27T18:03:17"
        created_at: "2021-04-27T18:03:17"
