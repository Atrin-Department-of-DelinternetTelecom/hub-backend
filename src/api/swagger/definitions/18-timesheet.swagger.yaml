definitions:
  TimeSheet:
    type: "object"
    required:
      - "end_date"
      - "id"
      - "owner_id"
      - "start_date"
    properties:
      created_at:
        type: "string"
        minLength: 1
      deleted_at:
        type: "string"
        minLength: 1
      end_date:
        type: "string"
        minLength: 1
      id:
        type: "number"
      owner_id:
        type: "number"
      start_date:
        type: "string"
        minLength: 1
      updated_at:
        type: "string"
        minLength: 1
    description: "attached a excel file of report the timesheets"
    title: "Timesheet"
    x-examples:
      example-1:
        created_at: "2021-04-27T18:36:57"
        deleted_at: "2021-04-27T18:36:57"
        end_date: "2020-01-24 00:00:00"
        id: 1
        owner_id: 3
        start_date: "2020-01-22 00:00:00"
        updated_at: "2021-04-27T18:36:57"
