definitions:
  Signature:
    type: "object"
    required:
      - "creator_id"
      - "id"
      - "is_valid"
      - "owner_id"
    properties:
      created_at:
        type: "string"
        format: "date-time"
      creator_id:
        type: "number"
        example: 5
        description: "who created this row"
      deleted_at:
        type: "string"
        format: "date-time"
      id:
        type: "number"
        example: 1
      is_valid:
        type: "boolean"
        default: false
      owner_id:
        type: "number"
        example: 5
        description: "this signature belongs to who"
      updated_at:
        type: "string"
        format: "date-time"
    description: "image of signature attached here (by media library)"
    title: "Signature"
    x-examples:
      example-1:
        created_at: "2021-04-27T18:34:42"
        creator_id: 2
        deleted_at: "2021-04-27T18:34:42"
        id: 1
        is_valid: 1
        owner_id: 4
        updated_at: "2021-04-27T18:34:42"
