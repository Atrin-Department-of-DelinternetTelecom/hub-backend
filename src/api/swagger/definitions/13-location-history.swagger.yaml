definitions:
  Location-History:
    type: "object"
    required:
      - "dates"
      - "id"
      - "route"
      - "routeable_id"
      - "routeable_type"
    properties:
      created_at:
        type: "string"
        format: "date-time"
        example: "2021-04-29 01:45:50.0"
      dates:
        type: "array"
        description: "date of location(point) inserted."
        items:
          type: "string"
      deleted_at:
        type: "string"
        format: "date-time"
        example: "2021-04-29 01:45:50.0"
      id:
        type: "number"
        example: 3
      route:
        type: "string"
        description: "this is spetial type of location geo\n"
        minLength: 1
      routeable_id:
        type: "number"
        example: 5
      routeable_type:
        type: "string"
        minLength: 1
        enum:
          - "vehicle"
          - "user"
      updated_at:
        type: "string"
        format: "date-time"
        example: "2021-04-29 01:45:50.0"
    description: ""
    title: "LocationHistory"
    x-examples:
      example-1:
        created_at: "2021-04-27T17:09:40.000000Z"
        id: 1
        route: "this is specific type of geo"
        routeable_id: 5
        routeable_type: "vehicle"
        updated_at: "2021-04-27T17:10:44.000000Z"
