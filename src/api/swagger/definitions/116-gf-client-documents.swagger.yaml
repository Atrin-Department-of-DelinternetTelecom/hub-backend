definitions:
  GfClientDocument:
    type: "object"
    required:
      - id
      - uid
      - name 
    properties:
      id:
        type: number
        example: 12
      uid:
        type: number
        example: -1
      clientId:
        type: integer
        example: 1
      name:
        type: string
        example: My Name
      file:
        type: string
        example: myfile.png
      conceptId:
        type: integer
        example: 1
      status:
        type: number
        example: 1
      updateDate:
        type: string
        example: "2021-04-29 01:47:27.0"
        minLength: 1  
      creationDate:
        type: string
        example: "2021-04-29 01:47:27.0"
        minLength: 1
    description: ""
    title: "gf-client-documents"

    