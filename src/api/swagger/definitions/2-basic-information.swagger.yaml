definitions:
  Basic-Information:
    type: "object"
    required:
      - "birth_date"
      - "department_id"
      - "employee_id"
      - "employment_status_id"
      - "gender"
      - "immigration_status"
      - "job_id"
      - "joined_date"
      - "marital_status"
      - "pay_grade"
      - "work_station_id"
    properties:
      NIC:
        type: "string"
        example: "212sn4717"
      SSN_NRIC:
        type: "string"
        example: "2338m412"
      birth_date:
        type: "string"
        format: "date"
        example: "2021-04-29"
      confirmation_date:
        type: "string"
        format: "date"
        example: "2021-04-13"
      created_at:
        type: "string"
        format: "date-time"
        example: "2021-04-29 01:59:26.0"
      deleted_at:
        type: "string"
        format: "date-time"
        example: "2021-04-29 01:59:26.0"
      department_id:
        type: "number"
        example: 3
        description: "related to a department table(id of recorded row in table)"
      driving_license_no:
        type: "string"
        example: "1223364"
      employee_id:
        type: "number"
        example: 12
        description: "this row(basic information record belongs to witch employee)"
        minimum: 0
      employee_number:
        type: "string"
        example: "23s158"
      employment_status_id:
        type: "number"
        example: 3
        description: "related to a employment_status table(id of recorded row in table)"
      gender:
        type: "string"
        example: "male"
        enum:
          - "male"
          - "female"
          - "other"
      id:
        type: "string"
      immigration_status:
        type: "string"
        example: "citizen"
        enum:
          - "citizen"
          - "permanent resident"
          - "work permit holder"
          - "depandant pass holder"
      job_id:
        type: "number"
        example: 7
        description: "related to a job table(id of recorded row in table)"
      joined_date:
        type: "string"
        format: "date"
        example: "2021-04-29"
      marital_status:
        type: "string"
        example: "single"
        enum:
          - "single"
          - "married"
          - "divorced"
          - "widowed"
          - "other"
      other_id:
        type: "object"
        description: "other id may an employee should have\nit should be save as object\n"
        properties: {}
      pay_grade:
        type: "string"
        example: "manager"
        enum:
          - "manager"
          - "executive"
          - "assistant"
          - "administrator"
      termination_date:
        type: "string"
        format: "date"
        example: "2021-05-29"
      updated_at:
        type: "string"
        format: "date-time"
        example: "2021-04-29 01:59:26.0"
      work_station_id:
        type: "number"
        example: 15
    title: "Basic-Information"
    x-examples:
      example-1:
        NIC: "212sn4717"
        SSN_NRIC: "2338m412"
        birth_date: "2021-04-29"
        confirmation_date: "2021-04-13"
        created_at: "2021-04-29 01:59:26.0"
        deleted_at: "2021-04-29 01:59:26.0"
        department_id: "3"
        driving_license_no: "1223364"
        employee_id: 12
        employee_number: "23s158"
        employment_status_id: "3"
        gender: "male"
        id: "string"
        immigration_status: "citizen"
        job_id: "7"
        joined_date: "2021-04-29"
        marital_status: "single"
        other_id: {}
        pay_grade: "manager"
        termination_date: "2021-05-29"
        updated_at: "2021-04-29 01:59:26.0"
        work_station_id: "15"
