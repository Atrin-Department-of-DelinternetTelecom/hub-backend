definitions:
  Skill:
    type: "object"
    required:
      - "id"
      - "name"
    properties:
      created_at:
        type: "string"
        format: "date-time"
        example: "2021-04-29 01:24:06.0"
      deleted_at:
        type: "string"
        format: "date-time"
        example: "2021-04-29 01:24:06.0"
      id:
        type: "number"
        example: 12
      name:
        type: "string"
        example: "fast typing"
      updated_at:
        type: "string"
        format: "date-time"
        example: "2021-04-29 01:24:06.0"
    title: "Skill"
    x-examples:
      example-1:
        created_at: "2021-04-29 01:24:06.0"
        deleted_at: "2021-04-29 01:24:06.0"
        id: "12"
        name: "fast typing"
        updated_at: "2021-04-29 01:24:06.0"
