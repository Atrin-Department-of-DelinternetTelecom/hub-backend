definitions:
  InvoiceRemittance:
    type: object
    required:
      - date
    properties:
      date:
        type: string
        example: '2023-02-01'
      name:
        type: string
        example: 'remittance of month 12'
      bankId:
        type: number
        example: 1
      limit:
        type: number
        example: 4444
      code:
        type: string
        example: '{a:5,testss}'

    description: ''
    title: InvoiceRemittance
