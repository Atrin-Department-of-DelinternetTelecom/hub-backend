definitions:
  Education:
    type: "object"
    required:
      - "completed_on"
      - "employee_id"
      - "id"
      - "institute"
      - "qualification"
      - "start_date"
    properties:
      completed_on:
        type: "string"
        example: "2021-04-29 01:47:27.0"
        minLength: 1
      created_at:
        type: "string"
        example: "2021-04-29 01:47:27.0"
        minLength: 1
      deleted_at:
        type: "string"
        example: "2021-04-29 01:47:27.0"
      employee_id:
        type: "number"
        example: 3
      id:
        type: "number"
        example: 12
      institute:
        type: "string"
        example: "shiraz uni"
        minLength: 1
      qualification:
        type: "string"
        example: "diploma"
        minLength: 1
        enum:
          - "bachelors digree"
          - "diploma"
          - "masters digree"
          - "doctorate"
      start_date:
        type: "string"
        example: "2021-04-29 01:47:27.0"
        minLength: 1
      updated_at:
        type: "string"
        example: "2021-04-29 01:47:27.0"
        minLength: 1
    description: ""
    title: "Education"
    x-examples:
      example-1:
        completed_on: "2021-04-22 00:00:00"
        created_at: "2021-04-27T17:31:29"
        employee_id: 2
        id: 2
        institute: "califonia"
        qualification: "doctorate"
        start_date: "2021-04-18 00:00:00"
        updated_at: "2021-04-27T17:31:29"
