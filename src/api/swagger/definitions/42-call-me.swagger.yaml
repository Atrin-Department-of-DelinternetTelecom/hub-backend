definitions:
  CallMe:
    type: "object"
    required:
      - "id"
      - "name"
      - "phone_number"
      - "email"
      - "processed_by_user_id"
      - "status"
      - "metadata"
      - "created_at"
      - "updated_at"
      - "deleted_at"
    properties:
      id:
        type: "number"
        example: 12
      name:
        type: "string"
        example: "payroll"
      phone_number:
        type: "string"
        example: "09305505766"
      email:
        type: "string"
        example: "ali@gmail.com"
      processed_by_user_id:
        type: "number"
        example: 23
      metadata:
        type: "string"
        example: "{new_doc:'value'}"
      status:
        type: "string"
        example: "pending"
      creator_id:
        type: "number"
        example: 12
      updated_at:
        type: "string"
        example: "2021-04-29 01:47:27.0"
        minLength: 1  
      created_at:
        type: "string"
        example: "2021-04-29 01:47:27.0"
        minLength: 1
      deleted_at:
        type: "string"
        example: "2021-04-29 01:47:27.0"
        minLength: 1
    description: ""
    title: "call-me"
  NewCallMe:
    type: "object"
    properties:
      name:
        type: "string"
        minLength: 3
        example: "payroll"
      phone_number:
        type: "string"
        minLength: 1
        example: "09305505766"
      email:
        type: "string"
        format: "email"
        example: "ali@gmail.com"
      status:
        type: "string"
        minLength: 3
        example: "pending"
      processed_by_user_id:
        type: "number"
        example: 23
      metadata:
        type: "string"
        minLength: 1
        example: "{new_doc:'value'}"
      description:
        type: "string"
        example: "description"
    description: ""
    title: "new-call-me"