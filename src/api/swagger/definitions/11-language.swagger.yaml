definitions:
  Language:
    type: "object"
    required:
      - "employee_id"
      - "id"
      - "language"
      - "listening"
      - "reading"
      - "speaking"
      - "writing"
    properties:
      created_at:
        type: "string"
        format: "date-time"
      deleted_at:
        type: "string"
        format: "date-time"
      employee_id:
        type: "number"
        example: 3
      id:
        type: "number"
        example: 7
      language:
        type: "string"
        example: "en"
        minLength: 1
      listening:
        type: "string"
        example: "Elementry proficiency"
        minLength: 1
        enum:
          - "Elementry proficiency"
          - "limited working proficiency"
          - "professional working proficiency"
          - "full professional proficiency"
          - "native or bilingual proficiency"
      reading:
        type: "string"
        example: "native or bilingual proficiency"
        minLength: 1
        enum:
          - "Elementry proficiency"
          - "limited working proficiency"
          - "professional working proficiency"
          - "full professional proficiency"
          - "native or bilingual proficiency"
      speaking:
        type: "string"
        example: "native or bilingual proficiency"
        minLength: 1
        enum:
          - "Elementry proficiency"
          - "limited working proficiency"
          - "professional working proficiency"
          - "full professional proficiency"
          - "native or bilingual proficiency"
      updated_at:
        type: "string"
        format: "date-time"
        example: "2021-04-29 01:45:50.0"
      writing:
        type: "string"
        example: "full professional proficiency"
        minLength: 1
        enum:
          - "Elementry proficiency"
          - "limited working proficiency"
          - "professional working proficiency"
          - "full professional proficiency"
          - "native or bilingual proficiency"
    description: ""
    title: "Language"
    x-examples:
      example-1:
        created_at: "2021-04-27T17:29:21.000000Z"
        employee_id: 2
        id: 5
        language: "en"
        listening: "professional working proficiency"
        reading: "professional working proficiency"
        speaking: "professional working proficiency"
        updated_at: "2021-04-27T17:29:21.000000Z"
        writing: "professional working proficiency"
