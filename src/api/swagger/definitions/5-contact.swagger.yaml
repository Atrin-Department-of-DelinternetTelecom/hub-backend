definitions:
  Contact:
    type: "object"
    required:
      - "employee_id"
      - "id"
      - "name"
    properties:
      created_at:
        type: "string"
        format: "date-time"
        example: "2021-04-29 01:30:07.0"
      deleted_at:
        type: "string"
        format: "date-time"
        example: "2021-04-29 01:30:07.0"
      employee_id:
        type: "number"
        example: 3
        description: "this record belongs to witch employee(or another role)"
      home_phone:
        type: "string"
        example: "07152446953"
      id:
        type: "string"
        example: "2"
      mobile_phone:
        type: "string"
        example: "09305505766"
      name:
        type: "string"
        example: "ali"
      updated_at:
        type: "string"
        format: "date-time"
        example: "2021-04-29 01:30:07.0"
      work_phone:
        type: "string"
        example: "07152446953"
    title: "Contact"
    x-examples:
      example-1:
        created_at: "2021-04-29 01:30:07.0"
        deleted_at: "2021-04-29 01:30:07.0"
        employee_id: 3
        home_phone: "07152446953"
        id: "2"
        mobile_phone: "09305505766"
        name: "ali"
        updated_at: "2021-04-29 01:30:07.0"
        work_phone: "07152446953"
