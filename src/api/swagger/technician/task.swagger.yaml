/technician/tasks/{id}/material-presets:
  get:
    tags:
      - 'technician'
    summary: 'Your GET endpoint'
    description: 'get material presets'
    operationId: 'getTaskPresets'
    parameters:
      - in: path
        name: id
        required: true
        type: number
    security:
      - Bearer: []
    produces:
      - 'application/json'
    responses:
      '200':
        description: OK
        schema:
          type: object
          properties:
            code:
              type: integer
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  materials:
                    type: array
                    items:
                      type: object
                      properties:
                        materialId:
                          type: integer
                        title:
                          type: string
                        amount:
                          type: integer
                        unit:
                          type: string
            meta:
              type: object
    x-swagger-router-controller: 'Technician'

