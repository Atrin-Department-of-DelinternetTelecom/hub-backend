/technician/tasks/{id}/installation-report:
  get:
    tags:
      - 'installation report'
    description: 'get installation report for a task'
    operationId: 'getReportByTaskId'
    parameters:
      - name: id
        in: path
        required: true
        type: string
    security:
      - Bearer: []
    produces:
      - 'application/json'
    responses:
      '200':
        description: 'OK'
    x-swagger-router-controller: 'InstallationReport'

/technician/tasks/{id}:
  get:
    tags:
      - 'technician'
    summary: 'Your GET endpoint'
    description: 'get technician task'
    operationId: 'getTask'
    parameters:
      - name: id
        in: path
        required: true
        type: number
    security:
      - Bearer: []
    produces:
      - 'application/json'
    responses:
      '200':
        description: 'OK'
    x-swagger-router-controller: 'Technician'

/technician/tasks/{id}/finish:
  post:
    tags:
      - 'technician'
    description: 'finish technician task'
    operationId: 'finishTask'
    parameters:
      - name: id
        in: path
        required: true
        type: number

      - name: body
        in: body
        schema:
          type: object
          properties:
            coordinates:
              type: object
              properties:
                lat:
                  type: number
                lng:
                  type: number
    security:
      - Bearer: []
    produces:
      - 'application/json'
    responses:
      '200':
        description: 'OK'
    x-swagger-router-controller: 'Technician'

/technician/tasks/{id}/cancel:
  post:
    tags:
      - 'technician'
    description: 'cancel technician task'
    operationId: 'cancelTask'
    parameters:
      - name: id
        in: path
        required: true
        type: number
      - name: body
        in: body
        schema:
          type: object
          properties:
            reasonId:
              type: number
            description:
              type: string
            by:
              type: string
              enum: ['technician', 'operator']
            coordinates:
              type: object
              properties:
                lat:
                  type: number
                lng:
                  type: number

    security:
      - Bearer: []
    produces:
      - 'application/json'
    responses:
      '200':
        description: 'OK'
    x-swagger-router-controller: 'Technician'

/technician/tasks/{id}/set-in-progress-step:
  post:
    tags:
      - 'technician'
    summary: 'Your GET endpoint'
    description: 'get current in-progress step'
    operationId: 'setTaskInProgressStep'
    parameters:
      - in: path
        name: id
        required: true
        type: number

      - in: body
        name: body
        required: true
        schema:
          type: object
          properties:
            step:
              type: string
          required:
            - step
    security:
      - Bearer: []
    produces:
      - 'application/json'
    responses:
      '200':
        description: 'OK'
    x-swagger-router-controller: 'Technician'

/technician/tasks/{type}/{typeId}/start:
  post:
    tags:
      - 'technician'
    summary: 'Your GET endpoint'
    description: 'start technician task'
    operationId: 'startTaskByTypeId'
    parameters:
      - name: type
        in: path
        required: true
        type: string

      - name: typeId
        in: path
        required: true
        type: number

      - name: body
        in: body
        required: false
        schema:
          type: object
          properties:
            coordinates:
              type: object
              properties:
                lat:
                  type: number
                lng:
                  type: number

    security:
      - Bearer: []
    produces:
      - 'application/json'
    responses:
      '200':
        description: 'OK'
    x-swagger-router-controller: 'Technician'

/technician/tasks/{id}/save-cpe-sn:
  post:
    tags:
      - 'technician'
    summary: 'Your GET endpoint'
    description: 'save router cpe sn'
    operationId: 'saveCpeSn'
    parameters:
      - in: path
        name: id
        required: true
        type: number
      - in: body
        name: body
        required: true
        schema:
          type: object
          properties:
            cpeSn:
              type: string
          required:
