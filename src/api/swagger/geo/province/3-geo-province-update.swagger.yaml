/geo/province/{id}:
  patch:
    tags:
      - 'geo-province'
    summary: 'Automation update provinces'
    description: 'update Geo-Province'
    operationId: 'update'
    security:
      - Bearer: []
    produces:
      - 'application/json'
    parameters:
      - name: 'id'
        in: 'path'
        description: 'id of country : 1 for spain'
        required: true
        type: 'number'
    responses:
      '200':
        description: 'OK'
        schema:
          type: 'object'
          required:
            - 'data'
            - 'meta'
          properties:
            meta:
              type: 'object'
              properties:
                code:
                  type: 'number'
    x-swagger-router-controller: 'GeoProvince'
