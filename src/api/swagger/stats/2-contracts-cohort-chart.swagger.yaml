/stats/contracts/cohort-chart:
  get:
    tags:
      - "stats"
    summary: "Your GET endpoint"
    description: "contracts cohort chart"
    operationId: "getContractsCohortChart"
    security:
      - Bearer: []
    produces:
      - "application/json"
    parameters:
      - name: "year"
        in: "query"
        required: true
        type: "string"

      - name: "service"
        in: "query"
        type: "string"
        enum:
          - radio
          - fibra
          - cell
          - tv
          - fix

    responses:
      "200":
        description: "OK"
        schema:
          type: "object"
          required:
            - "data"
          properties:
            data:
              type: "array"
              uniqueItems: true
              items: {}
              minItems: 1
      "401":
        description: "Unauthorized"
        schema:
          $ref: "#/definitions/Response_401"
      "403":
        description: "Forbidden"
        schema:
          $ref: "#/definitions/Response_403"
      "500":
        description: "InternalServerError"
        schema:
          $ref: "#/definitions/Response_500"
    x-swagger-router-controller: "StatsContract"
