/stats/tags:
  get:
    x-pagination: true
    x-filter: true
    tags:
      - 'stats'
    summary: 'Your GET endpoint'
    description: 'get all tags stats'
    operationId: 'getTagsStats'
    security:
      - Bearer: []
    produces:
      - 'application/json'
    parameters:
      - name: startDate
        in: 'query'
        required: true
        type: string
        default: '2022-01-01'

      - name: endDate
        in: 'query'
        type: string
    responses:
      '200':
        description: 'OK'
        schema:
          type: 'object'
          properties:
            data:
              type: 'array'
              items:
                type: 'object'
                properties:
                  id:
                    type: 'string'
                    example: 'crm-task:123'
                  type:
                    type: 'string'
                  name:
                    type: 'string'
                  creationDate:
                    type: 'string'
                    format: date
                  creator_name:
                    type: 'string'
                  count:
                    type: 'number'
                  percent:
                    type: 'number'
                  first_usage_date:
                    type: 'string'
                    format: date
                  last_usage_date:
                    type: 'string'
                    format: date
      '401':
        description: 'Unauthorized'
        schema:
          $ref: '#/definitions/Response_401'
      '403':
        description: 'Forbidden'
        schema:
          $ref: '#/definitions/Response_403'
      '500':
        description: 'InternalServerError'
        schema:
          $ref: '#/definitions/Response_500'
    x-swagger-router-controller: 'StatsTags'
