/stats/sellers/{id}/points-chart:
  get:
    tags:
      - 'stats'
    summary: 'Your GET endpoint'
    description: 'get stats'
    operationId: 'getSellerPointsChart'
    security:
      - Bearer: []
    produces:
      - 'application/json'
    parameters:
      - name: id
        in: path
        required: true
        type: number
        format: integer

      - name: step
        in: 'query'
        description: 'type'
        required: true
        type: string
        enum:
          - day
          - week
          - month
          - year
        default: month

      - name: startDate
        in: 'query'
        required: true
        type: string
        default: '2022-01-01'

      - name: endDate
        in: 'query'
        type: string

    responses:
      '200':
        description: 'OK'
        schema:
          type: 'object'
          required:
            - 'data'
          properties:
            data:
              type: 'object'
      '401':
        description: 'Unauthorized'
        schema:
          $ref: '#/definitions/Response_401'
      '403':
        description: 'Forbidden'
        schema:
          $ref: '#/definitions/Response_403'
      '500':
        description: 'InternalServerError'
        schema:
          $ref: '#/definitions/Response_500'
    x-swagger-router-controller: 'StatsSellers'
