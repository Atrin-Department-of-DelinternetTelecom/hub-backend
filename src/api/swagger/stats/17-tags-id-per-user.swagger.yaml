/stats/tags/{id}/per-user:
  get:
    x-pagination: true
    x-filter: true
    tags:
      - 'stats'
    summary: 'Your GET endpoint'
    description: 'get stats for a crm-task tag'
    operationId: 'getTagStatsPerUser'
    security:
      - Bearer: []
    produces:
      - 'application/json'
    parameters:
      - name: 'id'
        in: 'path'
        description: 'id of tag. example: crm-task:14'
        required: true
        type: 'string'

      - name: startDate
        in: 'query'
        required: true
        type: string
        default: '2022-01-01'

      - name: endDate
        in: 'query'
        type: string
    responses:
      '200':
        description: 'OK'
        schema:
          type: 'object'
          properties:
            data:
              type: 'array'
              items:
                type: 'object'
                properties:
                  id:
                    type: 'number'
                    example: 1
                  name:
                    type: 'string'
                    example: 'Eugeni'
                  status:
                    type: 'number'
                    example: 1
                  image:
                    type: 'string'
                    example: '99963-iron-man-armadura-jpg.jpg'
                  count:
                    type: 'number'
      '401':
        description: 'Unauthorized'
        schema:
          $ref: '#/definitions/Response_401'
      '403':
        description: 'Forbidden'
        schema:
          $ref: '#/definitions/Response_403'
      '500':
        description: 'InternalServerError'
        schema:
          $ref: '#/definitions/Response_500'
    x-swagger-router-controller: 'StatsTags'
