/stats/pinned-users/{row}:
  delete:
    tags:
      - "stats"
    summary: ""
    description: "Unpin a user"
    operationId: "deleteUnpinUser"
    security:
      - Bearer: []
    parameters:
      - in: path
        name: "row"
        type: "string"
        required: true
        description: "concatenation of ui table name and id of user that you want to unpin example: installers:2154"
    responses:
      "200":
        description: "OK"
      "401":
        description: "Unauthorized"
        schema:
          $ref: "#/definitions/Response_401"
      "403":
        description: "Forbidden"
        schema:
          $ref: "#/definitions/Response_403"
      "500":
        description: "InternalServerError"
        schema:
          $ref: "#/definitions/Response_500"
    x-swagger-router-controller: "StatsPinUser"
