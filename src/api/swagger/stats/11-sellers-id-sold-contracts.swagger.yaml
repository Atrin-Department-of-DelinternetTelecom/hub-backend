/stats/sellers/{id}/sold-contracts:
  get:
    tags:
      - 'stats'
    x-pagination: true
    x-filter: true
    description: 'get list of contracts that was sold by a seller'
    operationId: 'getContractsSoldBySeller'
    security:
      - Bearer: []
    produces:
      - 'application/json'
    parameters:
      - name: 'id'
        in: 'path'
        description: 'id of user'
        required: true
        type: 'string'

      - name: startDate
        in: 'query'
        required: true
        type: string
        default: '2022-01-01'

      - name: endDate
        in: 'query'
        type: string

      - name: dateColumn
        in: 'query'
        type: string
        default: 'creationDate'
        enum:
          - creationDate
          - dateActivation
    responses:
      '200':
        description: 'OK'
        schema:
          type: 'object'
      '401':
        description: 'Unauthorized'
        schema:
          $ref: '#/definitions/Response_401'
      '403':
        description: 'Forbidden'
        schema:
          $ref: '#/definitions/Response_403'
      '500':
        description: 'InternalServerError'
        schema:
          $ref: '#/definitions/Response_500'
    x-swagger-router-controller: 'StatsSellers'
