/stats/fee-groups/summary:
  get:
    tags:
      - 'stats'
    summary: 'Your GET endpoint'
    description: 'get all fee groups with stats'
    operationId: 'feeGroupsSummary'
    security:
      - Bearer: []
    produces:
      - 'application/json'
    parameters:
      - name: startDate
        in: 'query'
        required: true
        type: string
        default: '2022-01-01'

      - name: endDate
        in: 'query'
        type: string
    responses:
      '200':
        description: 'OK'
        schema:
          type: 'object'
          properties:
            data:
              type: 'object'
              properties:
                active:
                  type: 'number'
                pending:
                  type: 'number'
                suspended:
                  type: 'number'
                blocked:
                  type: 'number'
                total:
                  type: 'number'
      '401':
        description: 'Unauthorized'
        schema:
          $ref: '#/definitions/Response_401'
      '403':
        description: 'Forbidden'
        schema:
          $ref: '#/definitions/Response_403'
      '500':
        description: 'InternalServerError'
        schema:
          $ref: '#/definitions/Response_500'
    x-swagger-router-controller: 'StatsFeeGroups'
