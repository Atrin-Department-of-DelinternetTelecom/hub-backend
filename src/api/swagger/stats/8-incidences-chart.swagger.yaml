/stats/incidences/chart:
  get:
    tags:
      - 'stats'
    description: 'incidences chart'
    operationId: 'getIncidencesChart'
    security:
      - Bearer: []
    produces:
      - 'application/json'
    parameters:
      - name: step
        in: 'query'
        description: 'type'
        required: true
        type: string
        enum:
          - day
          - week
          - month
          - year
        default: month

      - name: startDate
        in: 'query'
        required: true
        type: string
        default: '2022-01-01'

      - name: endDate
        in: 'query'
        type: string

    responses:
      '200':
        description: 'OK'
        schema:
          type: 'object'
          properties:
            data:
              type: 'array'
              items:
                type: 'object'
                properties:
                  range:
                    type: 'object'
                    properties:
                      start:
                        type: 'string'
                        format: date
                      end:
                        type: 'string'
                        format: date
                  stats:
                    type: 'object'
                    properties:
                      internet:
                        type: 'number'
                        example: 278
                      fix:
                        type: 'number'
                        example: 278
                      cell:
                        type: 'number'
                        example: 278
                      tv:
                        type: 'number'
                        example: 278
                  step:
                    type: 'string'
                    example: 'month'
      '401':
        description: 'Unauthorized'
        schema:
          $ref: '#/definitions/Response_401'
      '403':
        description: 'Forbidden'
        schema:
          $ref: '#/definitions/Response_403'
      '500':
        description: 'InternalServerError'
        schema:
          $ref: '#/definitions/Response_500'
    x-swagger-router-controller: 'StatsIncidences'
