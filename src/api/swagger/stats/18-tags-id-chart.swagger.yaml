/stats/tags/{id}/chart:
  get:
    tags:
      - 'stats'
    summary: 'Your GET endpoint'
    description: 'get stats for a crm-task tag'
    operationId: 'getTagChart'
    security:
      - Bearer: []
    produces:
      - 'application/json'
    parameters:
      - name: 'id'
        in: 'path'
        description: 'id of tag. example: crm-task:14'
        required: true
        type: 'string'

      - name: step
        in: 'query'
        description: 'type'
        required: true
        type: string
        enum:
          - day
          - week
          - month
          - year
        default: month

      - name: startDate
        in: 'query'
        required: true
        type: string
        default: '2022-01-01'

      - name: endDate
        in: 'query'
        type: string

    responses:
      '200':
        description: 'OK'
        schema:
          type: 'object'
          properties:
            data:
              type: 'array'
              items:
                type: 'object'
                properties:
                  range:
                    type: 'object'
                    properties:
                      start:
                        type: 'string'
                        format: date
                      end:
                        type: 'string'
                        format: date
                  count:
                    type: 'number'
                    example: 451
                  status:
                    type: 'number'
                    example: 1
                  step:
                    type: 'string'
                    example: 'month'
      '401':
        description: 'Unauthorized'
        schema:
          $ref: '#/definitions/Response_401'
      '403':
        description: 'Forbidden'
        schema:
          $ref: '#/definitions/Response_403'
      '500':
        description: 'InternalServerError'
        schema:
          $ref: '#/definitions/Response_500'
    x-swagger-router-controller: 'StatsTags'
