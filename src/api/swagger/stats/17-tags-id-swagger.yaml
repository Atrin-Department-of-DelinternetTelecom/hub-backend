/stats/tags/{id}:
  get:
    tags:
      - "stats"
    summary: "Your GET endpoint"
    description: "get stats for a crm-task tag"
    operationId: "getTagStats"
    security:
      - Bearer: []
    produces:
      - "application/json"
    parameters:
      - name: "id"
        in: "path"
        description: "id of tag. example: crm-task:14"
        required: true
        type: "string"
    responses:
      "200":
        description: "OK"
        schema:
          type: "object"
          properties:
            data:
              type: "object"
              properties:
                id:
                  type: "number"
                  example: 1
                name:
                  type: "string"
                  example: "Eugeni"
                status:
                  type: "number"
                  example: 1
                image:
                  type: "string"
                  example: "99963-iron-man-armadura-jpg.jpg"
                count:
                  type: "number"
      "401":
        description: "Unauthorized"
        schema:
          $ref: "#/definitions/Response_401"
      "403":
        description: "Forbidden"
        schema:
          $ref: "#/definitions/Response_403"
      "500":
        description: "InternalServerError"
        schema:
          $ref: "#/definitions/Response_500"
    x-swagger-router-controller: "StatsTags"
