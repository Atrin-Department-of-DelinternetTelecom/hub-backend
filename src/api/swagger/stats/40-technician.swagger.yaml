definitions:
  TechnicianTaskItem:
    type: object
    properties:
      clientName:
        type: string
        example: Juan Sanchez Oriola
      typeId:
        type: integer
        example: 31954
      clientId:
        type: integer
        example: 8700
      type:
        type: string
        example: incidence/assistance
      duoDate:
        type: string
        format: date-time
        example: 2025-06-11T06:00:00.000Z
      contractId:
        type: integer
        example: 29698
      isDone:
        type: integer
        enum: [0, 1]
        example: 0
      duration:
        type: integer
        example: 60
      technicianTaskId:
        type: integer
      startedAt:
        type: string
        format: date-time
      finishedAt:
        type: string
        format: date-time
      autoCloseAt:
        type: string
        format: date-time
      technicianState:
        type: string
        example: pending
      technicianId:
        type: integer
        example: 25
      technician:
        type: object
        properties:
          id:
            type: integer
            example: 25
          first_name:
            type: string
            example: Carlos
          last_name:
            type: string
            example: Bahillo
      cancelledById:
        type: integer
      cancelledByUser:
        type: string
      contract:
        type: object
        properties:
          id:
            type: integer
            example: 29698
          reference:
            type: string
            example: C029698-0046-008700
      technicianTask:
        type: object
        $ref: '#/definitions/TechnicianTask'

  TechnicianTask:
    type: object
    properties:
      id:
        type: integer
        example: 14579
      startedAt:
        type: string
        format: date-time
        example: '2025-06-11T05:38:41.000Z'
      finishedAt:
        type: string
        format: date-time
        example: '2025-06-11T06:20:01.000Z'
      cancelleAt:
        type: string
        format: date-time
      autoCloseAt:
        type: string
        format: date-time
      cancelledBy:
        type: string
      cancelReasonDescription:
        type: string
      cancelReason:
        type: string
      steps:
        type: array
        items:
          $ref: '#/definitions/TechnicianTask'

  TechnicianTaskStep:
    type: object
    properties:
      id:
        type: integer
        example: 77007
      taskId:
        type: integer
        example: 14579
      name:
        type: string
        example: reaching-to-the-destination
      index:
        type: integer
        example: 0
      state:
        type: string
        example: done
      error:
        type: string
      updatedAt:
        type: string
        format: date-time
        example: '2025-06-11T06:00:09.000Z'
      createdAt:
        type: string
        format: date-time
        example: '2025-06-11T05:38:41.000Z'
