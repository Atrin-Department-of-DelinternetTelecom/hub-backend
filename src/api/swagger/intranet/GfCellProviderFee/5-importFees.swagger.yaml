            data:
              - createDate: '2019-08-24'
                dateOfBirth: '1997-10-31'
                email: 'user@example.com'
                emailVerified: true
                firstName: 'John'
                id: 0
                lastName: 'Doe'
            links:
              first: 'https://example.com/api/v1/first'
              last: 'https://example.com/api/v1/last'
              next: 'https://example.com/api/v1/next'
              prev: 'https://example.com/api/v1/prev'
              self: 'https://example.com/api/v1/self'
            meta:
              code: 200
              current_page: 1
              from: 1
              last_page: 5
              links:
                - active: true
                  label: 'Next'
                  url: 'https://example.com/api/v1/next'
              path: '/gfcellproviderfee/import/fee'
              per_page: 10
              status: 'success'
              to: 10
              total: 50
      '401':
        description: 'Unauthorized - Invalid or missing authentication.'
        schema:
