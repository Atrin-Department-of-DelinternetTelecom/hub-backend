/gf-clients/{id}/docs:
  get:
    x-pagination: true
    tags:
      - 'gf-clients'
    summary: 'get list of the client docs'
    operationId: 'getAllDocs'
    security:
      - Bearer: []
    produces:
      - 'application/json'
    parameters:
      - name: id
        in: path
        description: id of gf-client table
        required: true
        type: integer

      - name: only
        in: query
        description: comma separated list of type of documents you want into response
        required: false
        type: string
    responses:
      '200':
        description: 'OK'
    x-swagger-router-controller: 'GfClient'
