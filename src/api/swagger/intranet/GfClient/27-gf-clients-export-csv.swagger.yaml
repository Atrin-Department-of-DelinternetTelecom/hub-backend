/gf-clients/export/csv:
  post:
    x-pagination: false
    x-filter: true
    tags:
      - 'gf-clients'
    description: 'Export filtered clients to CSV file'
    operationId: 'exportGfClients'
    security:
      - Bearer: []
    produces:
      - 'text/csv'
    responses:
      '200':
        description: 'OK'
      '401':
        description: 'Unauthorized'
        schema:
          $ref: '#/definitions/Response_401'
      '403':
        description: 'Forbidden'
        schema:
          $ref: '#/definitions/Response_403'
      '500':
        description: 'InternalServerError'
        schema:
          $ref: '#/definitions/Response_500'
    x-swagger-router-controller: 'GfClient'
