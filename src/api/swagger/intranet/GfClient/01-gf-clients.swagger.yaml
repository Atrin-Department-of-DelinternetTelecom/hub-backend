            iban:
              type: 'string'
              example: 'DE75512108001245126199 '
            bic:
              type: 'string'
              example: 'SOGEDEFF'
            bicName:
              type: 'string'
              example: 'Societe Generale'
            isRemitance:
              type: 'integer'
              example: 0
            paymentTypeId:
              type: 'number'
              example: 1
            payDay:
              type: 'integer'
