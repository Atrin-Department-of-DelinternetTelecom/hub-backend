              type: 'string'
            addressDoorCodeName:
              type: 'string'
            addressStairway:
              type: 'string'
            addressStairwayCode:
              type: 'string'
            addressStairwayCodeName:
              type: 'string'
            addressLat:
              type: 'string'
            addressLng:
              type: 'string'
