/gf-clients/document:
  post:
    tags:
      - "gf-clients"
    summary: "Your POST endpoint"
    description: "Upload gf-clients document number"
    operationId: "uploadDocument"
    security:
      - Bearer: []
    produces:
      - "application/json"
    parameters:
      - in: formData
        name: document
        type: file
        description: GfCleint document pdf
      - in: formData
        name: clientId
        type: number 
        description: The GfClient id
    responses:
      "200":
        description: "OK"
        schema:
          type: "object"
          required:
            - "data"
            - "meta"
          properties:
            data:
              $ref: "#/definitions/SingleFileUpload"
            meta:
              type: "object"
              properties:
                code:
                  type: "number"
                status:
                  type: "string"
                  minLength: 1
              required:
                - "code"
                - "status"
          description: ""
      "401":
        description: "Unauthorized"
        schema:
          $ref: "#/definitions/Response_401"
      "403":
        description: "Forbidden"
        schema:
          $ref: "#/definitions/Response_403"
      "500":
        description: "InternalServerError"
        schema:
          $ref: "#/definitions/Response_500"
    x-swagger-router-controller: "GfClient" 