/gf-clients/validate-iban:
  post:
    tags:
      - "gf-clients"
    summary: "Your POST endpoint"
    description: "Validate gf-clients IBAN number"
    operationId: "validateIban"
    security:
      - Bearer: []
    produces:
      - "application/json"
    parameters:
       -  in: "body"
          name: "body"
          required: true
          schema:
            type: "object"
            required:
              - "iban" 
            properties: 
              iban:
                type: "string"
                example: "DE75512108001245126199"
    responses:
      "200":
        description: "OK"
        schema:
          type: "object"
          required:
            - "data"
            - "meta"
          properties:
            data:
              $ref: "#/definitions/Iban"
            meta:
              type: "object"
              properties:
                code:
                  type: "number"
                status:
                  type: "string"
                  minLength: 1
              required:
                - "code"
                - "status"
          description: ""
      "401":
        description: "Unauthorized"
        schema:
          $ref: "#/definitions/Response_401"
      "403":
        description: "Forbidden"
        schema:
          $ref: "#/definitions/Response_403"
      "500":
        description: "InternalServerError"
        schema:
          $ref: "#/definitions/Response_500"
    x-swagger-router-controller: "Iban" 