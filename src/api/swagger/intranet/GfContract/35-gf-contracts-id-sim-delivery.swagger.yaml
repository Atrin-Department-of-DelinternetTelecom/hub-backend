/gf-contracts/{id}/sim-delivery:
  put:
    tags:
      - 'gf-contracts'
    summary: 'set sim delivery for a gf contract'
    operationId: putSimDelivery
    security:
      - Bearer: []
    produces:
      - 'application/json'
    parameters:
      - name: 'id'
        in: 'path'
        description: 'id of table contract'
        required: true
        type: 'integer'

      - in: 'body'
        name: 'body'
        required: true
        schema:
          $ref: '#/definitions/GfSimDeliveryInput'

    responses:
      '200':
        description: 'OK'
      '401':
        description: 'Unauthorized'
        schema:
          $ref: '#/definitions/Response_401'
      '403':
        description: 'Forbidden'
        schema:
          $ref: '#/definitions/Response_403'
      '500':
        description: 'InternalServerError'
        schema:
          $ref: '#/definitions/Response_500'
    x-swagger-router-controller: 'GfContract'

  get:
    tags:
      - 'gf-contracts'
    summary: 'get sim delivery for a gf contract'
    operationId: getSimDelivery
    security:
      - Bearer: []
    produces:
      - 'application/json'
    parameters:
      - name: 'id'
        in: 'path'
        description: 'id of table contract'
        required: true
        type: 'integer'

    responses:
      '200':
        description: 'OK'
      '401':
        description: 'Unauthorized'
        schema:
          $ref: '#/definitions/Response_401'
      '403':
        description: 'Forbidden'
        schema:
          $ref: '#/definitions/Response_403'
      '500':
        description: 'InternalServerError'
        schema:
          $ref: '#/definitions/Response_500'
    x-swagger-router-controller: 'GfContract'



definitions:
  GfSimDeliveryInput:
