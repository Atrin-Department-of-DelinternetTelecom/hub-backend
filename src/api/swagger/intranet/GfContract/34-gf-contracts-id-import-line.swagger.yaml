/gf-contracts/{id}/import-aire-line:
  post:
    deprecated: true
    tags:
      - 'gf-contracts'
    summary: 'Import AIRE line for given contract id'
    operationId: 'importAireLine'
    security:
      - Bearer: []
    produces:
      - 'application/json'
    parameters:
      - name: 'id'
        in: 'path'
        description: 'id of table contract'
        required: true
        type: 'string'
    responses:
      '200':
        description: 'OK'
        schema:
          type: 'object'
          required:
            - 'data'
            - 'meta'
          properties:
            data:
              $ref: '#/definitions/GfContract'
            meta:
              type: 'object'
              properties:
                code:
                  type: 'number'
                status:
                  type: 'string'
                  minLength: 1
              required:
                - 'status'
          description: ''

      '401':
        description: 'Unauthorized'
        schema:
          $ref: '#/definitions/Response_401'
      '403':
        description: 'Forbidden'
        schema:
          $ref: '#/definitions/Response_403'
      '500':
        description: 'InternalServerError'
        schema:
          $ref: '#/definitions/Response_500'
    x-swagger-router-controller: 'GfContract'
/gf-contracts/{id}/import-contract:
  post:
    tags:
      - 'gf-contracts'
