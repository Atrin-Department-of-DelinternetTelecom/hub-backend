/gf-contracts/{id}/cpe-action/{action}:
  post:
    tags:
      - "gf-contracts"
    summary: ""
    description: "add-bonus a gf-contracts by id"
    operationId: "doCpeAction"
    security:
      - Bearer: []
    produces:
      - application/json
    parameters: 
      - name: id
        in: path
        required: true
        type: integer
        description: Id of gf-contracts table

      - name: action
        in: path
        required: true
        type: string
        description: "reboot,factoryReset,refreshObject"  

    responses:
      "200":
        description: "OK"
        schema:
          type: "object"
          required:
            - "data"
            - "meta"
          properties:
            data:
              $ref: "#/definitions/GfContract"
            meta:
              type: "object"
              properties:
                code:
                  type: "number"
                message:
                  type: "string"
                  minLength: 1
                status:
                  type: "string"
                  minLength: 1
              required:
                - "code"
                - "message"
                - "status"
          description: ""
      "401":
        description: "Unauthorized"
        schema:
          $ref: "#/definitions/Response_401"
      "403":
        description: "Forbidden"
        schema:
          $ref: "#/definitions/Response_403"
      "500":
        description: "InternalServerError"
        schema:
          $ref: "#/definitions/Response_500"
    x-swagger-router-controller: "GfContract"
