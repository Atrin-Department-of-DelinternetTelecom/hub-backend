  post:
    tags:
      - 'gf-contracts'
    summary: ''
    description: 'add a gf-contract to system'
    operationId: 'postGfContracts'
    security:
      - Bearer: []
    consumes:
      - application/json
    produces:
      - application/json
    parameters:
      - in: body
        name: body
        schema:
          type: object
          required:
            - clientId
            - feeGroupId
          properties:
            uid:
              type: number
              default: 90
            clientId:
              type: number
              default: 22
            feeGroupId:
              type: number
            alias:
              type: string
            payDay:
              type: number
              default: 1
            invoiceMonths:
              type: number
              default: 1001
            percentageDiscount:
              type: number
              format: double
              default: 0
            invoiceProfileId:
              type: number
              default: 0
            dateActivation:
              type: string
              default: '2022-02-22'
            dateDeactivation:
              type: string
              default: '2022-02-22'
            comments:
              type: string
              default: Enter small description
            sellerId:
              type: number
            permanence:
              type: number
            permanenceEnd:
              type: string
              default: '2022-02-22'
            permanencePvp:
              type: number
              format: double
            tags:
              type: array
              default:
                - { id: 1, comment: '' }
              items:
                type: object
                properties:
                  id:
                    type: number
                  comment:
                    type: string
            initialFee:
              type: object
              properties:
                initial_fee_id:
                  type: number
                  example: 1
                start_date:
                  type: string
                end_date:
                  type: string
                installments:
                  type: number
                  example: 1
                discount:
                  type: number
                  format: decimal
    responses:
      '200':
        description: 'OK'
        schema:
          type: 'object'
          required:
            - 'data'
            - 'meta'
          properties:
            data:
              $ref: '#/definitions/GfContract'
            meta:
              type: 'object'
              properties:
                code:
                  type: 'number'
                message:
                  type: 'string'
                  minLength: 1
                status:
                  type: 'string'
                  minLength: 1
              required:
                - 'code'
                - 'message'
                - 'status'
          description: ''
      '401':
        description: 'Unauthorized'
        schema:
          $ref: '#/definitions/Response_401'
      '403':
        description: 'Forbidden'
        schema:
          $ref: '#/definitions/Response_403'
      '500':
        description: 'InternalServerError'
        schema:
          $ref: '#/definitions/Response_500'
    x-swagger-router-controller: 'GfContract'

/gf-contracts/{contractId}/save-cpe-sn:
  post:
    tags:
      - 'gf-contracts'
    summary: 'save cpe serial number by contract id'
    description: 'save router cpe sn'
    operationId: 'saveCpeSnByContractId'
    parameters:
      - in: path
        name: contractId
        required: true
        type: number
      - in: body
        name: body
        required: true
        schema:
          type: object
          properties:
            cpeSn:
              type: string
          required:
            - cpeSn
    security:
      - Bearer: []
    produces:
      - 'application/json'
    responses:
      '200':
        description: 'OK'
    x-swagger-router-controller: 'GfContract'