/package-statuses/{clientId}:
  get:
    tags:
      - 'package-status'
    summary: 'Your GET endpoint'
    description: 'get package suggestion for selected client'
    operationId: 'suggestDiscount'
    security:
      - Bearer: []
    produces:
      - 'application/json'
    parameters:
      - name: 'clientId'
        in: 'path'
        description: 'id of client'
        required: true
        type: 'number'
    responses:
      '200':
        description: 'OK'
        schema:
          type: 'object'
          required:
            - 'data'
            - 'meta'
          properties:
            data:
              $ref: '#/definitions/InvoiceUnits2'
            meta:
              type: 'object'
              properties:
                code:
                  type: 'number'
                status:
                  type: 'string'
                  minLength: 1
              required:
                - 'code'
                - 'status'
          description: ''
      '401':
        description: 'Unauthorized'
        schema:
          $ref: '#/definitions/Response_401'
      '403':
        description: 'Forbidden'
        schema:
          $ref: '#/definitions/Response_403'
      '500':
        description: 'InternalServerError'
        schema:
          $ref: '#/definitions/Response_500'
    x-swagger-router-controller: 'SuggestDiscount'
