                      id:
                        type: 'string'
                      node_type_id:
                        type: 'integer'
                      node_status_id:
                        type: 'integer'
                      network_provider_id:
                        type: 'integer'
                      city_code:
                        type: 'string'
                      city_formated_name:
                        type: 'string'
                      reference:
                        type: 'string'
                      suffix:
                        type: 'string'
                      location:
                        type: 'object'
                        properties:
                          lat:
                            type: 'number'
                            format: 'float'
                          lng:
                            type: 'number'
                            format: 'float'
                      created_at:
                        type: 'string'
                        format: 'date-time'
                      updated_at:
                        type: 'string'
                        format: 'date-time'
                      node_type_name:
                        type: 'string'
                      node_type_reference:
                        type: 'string'
                      node_status_code:
                        type: 'integer'
                      node_status_name:
                        type: 'string'
                      node_status_reference:
                        type: 'string'
                      node_status_color:
                        type: 'string'
                      network_provider_reference:
