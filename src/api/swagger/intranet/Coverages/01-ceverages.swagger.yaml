                              province_id:
                                type: 'string'
                              name:
                                type: 'string'
                              province:
                                type: 'object'
                                properties:
                                  id:
                                    type: 'string'
                                  geo_code:
                                    type: 'string'
                                  name:
                                    type: 'string'
                              geo_code:
                                type: 'string'
                          level:
                            type: 'string'
                          name:
