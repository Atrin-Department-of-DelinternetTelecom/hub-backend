                      trigger_available:
                        type: 'integer'
                      color:
                        type: 'string'
                      borderColor:
                        type: 'string'
                      created_at:
                        type: 'string'
                        format: 'date-time'
                      updated_at:
                        type: 'string'
                        format: 'date-time'
                  node:
                    type: 'object'
