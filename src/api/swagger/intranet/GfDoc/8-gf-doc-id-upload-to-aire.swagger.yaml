/gf-docs/{id}/to-aire:
  post:
    tags:
      - "gf-docs"
    summary: "Your POST endpoint"
    description: "Set gf-docs as signed"
    operationId: "uploadToAire"
    deprecated: true
    security:
      - Bearer: []
    produces:
      - "application/json"
    parameters:
      - name: id
        in: path
        description: id of gf-doc table
        required: true
        type: string 
    responses:
      "200":
        description: "OK"
        schema:
          type: "object"
          required:
            - "data"
            - "meta"
          properties:
            data:
              $ref: "#/definitions/GfDoc"
            meta:
              type: "object"
              properties:
                code:
                  type: "number"
                status:
                  type: "string"
                  minLength: 1
              required:
                - "code"
                - "status"
          description: ""
      "401":
        description: "Unauthorized"
        schema:
          $ref: "#/definitions/Response_401"
      "403":
        description: "Forbidden"
        schema:
          $ref: "#/definitions/Response_403"
      "500":
        description: "InternalServerError"
        schema:
          $ref: "#/definitions/Response_500"
    x-swagger-router-controller: "GfDoc" 
